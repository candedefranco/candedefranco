<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Candela De Franco — Software Engineer">
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(79,195,247,0.07)" stroke-width="1"/></pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#minor)"/><path d="M100 0H0V100" fill="none" stroke="rgba(79,195,247,0.15)" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L10 5L0 9" fill="none" stroke="#4fc3f7" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .zone { font-size: 8px; fill: #7f9bbd; text-anchor: middle; }
    .thin { stroke: #7f9bbd; stroke-width: 1; }
    .frame { fill: none; stroke: #e6f1ff; stroke-opacity: 0.55; }
    .kicker { font-size: 15px; fill: #4fc3f7; letter-spacing: 3px; }
    .name { font-size: 54px; font-weight: 700; fill: #e6f1ff; }
    .sub { font-size: 15px; fill: #7f9bbd; letter-spacing: 1.5px; }
    .dim { stroke: #4fc3f7; stroke-width: 1; }
    .dimtext { font-size: 11px; fill: #4fc3f7; letter-spacing: 1px; }
    .tiny { font-size: 9px; fill: #7f9bbd; letter-spacing: 1px; }
    .edge { fill: none; stroke: #4fc3f7; stroke-width: 1.5; stroke-linejoin: round; }
    .hidden { fill: none; stroke: #4fc3f7; stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.6; }
    .trace { fill: none; stroke: #4fc3f7; stroke-opacity: 0.35; stroke-width: 1.5; }
    .flow { fill: none; stroke: #4fc3f7; stroke-width: 1.5; stroke-dasharray: 4 8; }
    .pulse { fill: #e6f1ff; }
    .node { fill: #0a1628; stroke: #4fc3f7; stroke-width: 1.5; }
    .dot { fill: #4fc3f7; }
    .tb { fill: #0a1628; stroke: #e6f1ff; stroke-opacity: 0.55; }
    .tbl { stroke: #e6f1ff; stroke-opacity: 0.35; }
    .label { font-size: 8px; fill: #7f9bbd; letter-spacing: 1px; }
    .value { font-size: 12.5px; fill: #e6f1ff; font-weight: 700; }
  </style>

  <rect width="1000" height="320" fill="#0a1628"/>
  <rect x="24" y="24" width="952" height="272" fill="url(#major)"/>
  <rect x="12" y="12" width="976" height="296" class="frame"/>
  <rect x="24" y="24" width="952" height="272" class="frame"/>
  <text x="83.5" y="21" class="zone">1</text><text x="202.5" y="21" class="zone">2</text><line x1="143" y1="12" x2="143" y2="24" class="thin"/><text x="321.5" y="21" class="zone">3</text><line x1="262" y1="12" x2="262" y2="24" class="thin"/><text x="440.5" y="21" class="zone">4</text><line x1="381" y1="12" x2="381" y2="24" class="thin"/><text x="559.5" y="21" class="zone">5</text><line x1="500" y1="12" x2="500" y2="24" class="thin"/><text x="678.5" y="21" class="zone">6</text><line x1="619" y1="12" x2="619" y2="24" class="thin"/><text x="797.5" y="21" class="zone">7</text><line x1="738" y1="12" x2="738" y2="24" class="thin"/><text x="916.5" y="21" class="zone">8</text><line x1="857" y1="12" x2="857" y2="24" class="thin"/><text x="18" y="72.33333333333334" class="zone">A</text><text x="18" y="163" class="zone">B</text><line x1="12" y1="114.66666666666667" x2="24" y2="114.66666666666667" class="thin"/><text x="18" y="253.66666666666669" class="zone">C</text><line x1="12" y1="205.33333333333334" x2="24" y2="205.33333333333334" class="thin"/>

  <!-- Registration marks -->
  <g class="dim" opacity="0.7">
    <path d="M44 44h16M52 36v16"/><circle cx="52" cy="44" r="5" fill="none"/>
  </g>

  <text x="60" y="92" class="kicker">// SOFTWARE ENGINEER</text>
  <text x="60" y="148" class="name" textLength="530" lengthAdjust="spacingAndGlyphs">CANDELA DE FRANCO</text>
  <rect x="600" y="108" width="22" height="44" fill="#4fc3f7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Dimension line under the name -->
  <line x1="60" y1="164" x2="60" y2="182" class="dim"/>
  <line x1="590" y1="164" x2="590" y2="182" class="dim"/>
  <line x1="62" y1="176" x2="588" y2="176" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="245" y="169" width="160" height="14" fill="#0a1628"/>
  <text x="325" y="180" class="dimtext" text-anchor="middle">SCALE: ∞  (SEE NOTE 1)</text>

  <text x="60" y="218" class="sub">CLEAN CODE · CLOUD · SYSTEMS THAT SCALE</text>
  <text x="60" y="270" class="tiny">NOTE 1: ALL SYSTEMS DESIGNED TO SCALE HORIZONTALLY.</text>
  <text x="60" y="284" class="tiny">SOFTWARE ENGINEERING — UNIVERSIDAD AUSTRAL — CLASS OF 2028</text>

  <!-- Cloud node schematic -->
  <polygon points="820,45 867.63,72.5 820,100 772.37,72.5" fill="#4fc3f7" fill-opacity="0.22" class="edge"/>
  <polygon points="772.37,72.5 820,100 820,155 772.37,127.5" fill="#4fc3f7" fill-opacity="0.12" class="edge"/>
  <polygon points="820,100 867.63,72.5 867.63,127.5 820,155" fill="#4fc3f7" fill-opacity="0.05" class="edge"/>
  <path d="M772.37 127.5 L820 100 M820 45 V100" class="hidden"/>
  
    <path id="t0" d="M867.63 88 H900 V62 H933" class="trace"/>
    <path d="M867.63 88 H900 V62 H933" class="flow"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <circle r="3" class="pulse"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#t0"/></animateMotion></circle>
    <circle cx="945" cy="62" r="11" class="node"/>
    <circle cx="945" cy="62" r="3.5" class="dot"/>
    <text x="945" y="88" class="tiny" text-anchor="middle">LAMBDA</text>
    <path id="t1" d="M867.63 118 H900 V152 H933" class="trace"/>
    <path d="M867.63 118 H900 V152 H933" class="flow"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <circle r="3" class="pulse"><animateMotion dur="2.9s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
    <circle cx="945" cy="152" r="11" class="node"/>
    <circle cx="945" cy="152" r="3.5" class="dot"/>
    <text x="945" y="178" class="tiny" text-anchor="middle">S3</text>
    <path id="t2" d="M772.37 100 H733" class="trace"/>
    <path d="M772.37 100 H733" class="flow"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <circle r="3" class="pulse"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
    <circle cx="721" cy="100" r="11" class="node"/>
    <circle cx="721" cy="100" r="3.5" class="dot"/>
    <text x="721" y="126" class="tiny" text-anchor="middle">EC2</text>
  <line x1="772.37" y1="167" x2="772.37" y2="185" class="dim"/>
  <line x1="867.63" y1="167" x2="867.63" y2="185" class="dim"/>
  <line x1="774.37" y1="179" x2="865.63" y2="179" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="820" y="175" class="dimtext" text-anchor="middle">CLOUD</text>

  <!-- Title block -->
  <rect x="640" y="216" width="336" height="80" class="tb"/>
  <path d="M640 256H976M840 216V256M760 256V296M850 256V296M910 256V296" class="tbl"/>
  <text x="648" y="229" class="label">TITLE</text><text x="648" y="247" class="value">GITHUB PROFILE</text>
  <text x="848" y="229" class="label">DWG NO.</text><text x="848" y="247" class="value">CDF-001</text>
  <text x="648" y="269" class="label">DRAWN BY</text><text x="648" y="287" class="value">C. DE FRANCO</text>
  <text x="768" y="269" class="label">SCALE</text><text x="768" y="287" class="value">1:1</text>
  <text x="858" y="269" class="label">REV</text><text x="858" y="287" class="value">2026</text>
  <text x="918" y="269" class="label">SHEET</text><text x="918" y="287" class="value">1/1</text>
</svg>
